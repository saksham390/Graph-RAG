spring.application.name=graphrag
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/graphrag}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.sql.init.mode=always

neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
neo4j.username=${NEO4J_USERNAME:neo4j}
neo4j.password=${NEO4J_PASSWORD:password}

openai.api-key=${OPENAI_API_KEY:}
openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}